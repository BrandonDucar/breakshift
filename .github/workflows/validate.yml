name: Validate BREAKSHIFT

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Dependency-free application tests
        run: npm test
      - name: Portable demo evidence tests
        run: npm run test:demo
